<!DOCTYPE html>
<html>
<head>
    <title>Schedule</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
        }

        th {
            background-color: lightblue;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

        .time {
            background-color: lightyellow;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Times</th>
            <th>Events</th>
        </tr>

        <tr>
            <td class="time">8:00</td>
            <td>Waking up</td>
        </tr>

        <tr>
            <td class="time">8:26</td>
            <td>Eating breakfast</td>
        </tr>

        <tr>
            <td class="time">9:46</td>
            <td>Deep cleaning my room</td>
        </tr>

        <tr>
            <td class="time">11:22</td>
            <td>Doing a ton of homework</td>
        </tr>

         <tr>
            <td class="time">12:10</td>
            <td>Eating lunch/td>
        </tr>

        <tr>
            <td class="time">12:30</td>
            <td>Do more schoolwork/td>
        </tr>

        <tr>
            <td class="time">1:30</td>
            <td>Shopping</td>
        </tr>
        <tr>
            <td class="time">3:00</td>
            <td>More schoolwork</td>
        </tr>
    </table>
	
	 
</body>
</html>
